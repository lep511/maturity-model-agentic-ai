name: Validate content and check links

on:
  push:
    paths:
      - "data/**"
      - "guidance/**"
      - "tools/**"
      - "api/**"
      - "lib/**"
      - "vercel.json"
      - "mcp/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/check-links.yml"
  pull_request:
    paths:
      - "data/**"
      - "guidance/**"
      - "tools/**"
      - "api/**"
      - "lib/**"
      - "vercel.json"
      - "mcp/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/check-links.yml"

jobs:
  validate-and-check-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Give execution permissions
        run: |
          chmod +x data/count_chars.sh
          chmod +x data/extract_link.sh
          chmod +x data/check_link_action.sh

      - name: Validate generated content
        run: python3 -I tools/validate_content.py

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: API smoke test
        run: node tools/api_smoke_test.mjs

      - name: MCP smoke test
        run: node tools/mcp_smoke_test.mjs

      - name: Browser/Node helper sync test
        run: node tools/csv_sync_test.mjs

      - name: Count characters
        id: count_chars
        run: |
          ./data/count_chars.sh data || {
            echo "large_files_found=true" >> $GITHUB_OUTPUT
            exit 1
          }

      # Uploads large_files.json ONLY if count_chars found oversized files
      - name: Upload large files report
        if: always() && steps.count_chars.outputs.large_files_found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: large-files-report
          path: large_files.json

      - name: Extract links
        run: ./data/extract_link.sh .

      - name: Check links
        run: ./data/check_link_action.sh

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: link-results
          path: links_checked.json
